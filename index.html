<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LHC DHT11 ESP32 Web Flasher</title>
  <style>
    :root { --bg: #f4f7fb; --card: #fff; --ink: #172033; --muted: #475569; --line: #cbd5e1; --accent: #087f68; --danger: #a25500; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 80% 0, #dbeafe, var(--bg) 48%); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 9vh 0 60px; }
    h1 { margin: 8px 0; font-size: clamp(2.2rem, 7vw, 5.2rem); line-height: .98; letter-spacing: -.06em; }
    h2 { color: var(--accent); }
    .kicker { color: var(--accent); font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .card { margin-top: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.9); box-shadow: 0 12px 30px #33415514; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    .status { min-height: 88px; padding: 14px; border-radius: 12px; background: #172033; color: #f8fafc; white-space: pre-wrap; font-family: ui-monospace, monospace; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input[type=file] { width: 100%; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; background: #f8fafc; }
    button { cursor: pointer; margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; color: #fff; background: var(--accent); font: inherit; font-weight: 750; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .warning { border-left: 4px solid var(--danger); padding: 12px 16px; background: #fff1dc; color: #713f12; }
    code { color: #075e50; font-weight: 650; }
  </style>
</head>
<body>
<main>
  <div class="kicker">LHC Campinas · ESP32</div>
  <h1>Web Flasher</h1>
  <p>Grave o firmware do sensor ESP32 + DHT11 pelo navegador usando Web Serial.</p>
  <div class="card">
    <h2>Firmware</h2>
    <label for="firmware">Selecione o arquivo `.bin`</label>
    <input id="firmware" type="file" accept=".bin,application/octet-stream">
    <label><input id="full-image" type="checkbox"> Imagem completa: gravar em <code>0x000000</code> e apagar a flash</label>
    <p class="warning">Confirme o modelo ESP32 e a porta USB. O modo de imagem completa pode apagar configurações existentes.</p>
    <button id="flash" type="button" disabled>Conectar e gravar</button>
    <h2>Status</h2>
    <div id="status" class="status">Selecione um firmware para começar.</div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
